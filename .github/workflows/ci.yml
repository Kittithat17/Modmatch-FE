name: CI

# ยิงทุก push ทุก branch ใครก็ตามที่ push โค้ดขึ้นมาจะโดนรัน pipeline เสมอ
# และยิงอีกรอบตอนเปิด PR เข้า main หรือ dev เพราะ pull_request รันบนผลลัพธ์หลัง merge
# ซึ่งต่างจาก push ที่รันบนหัว branch เฉย ๆ
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# push ซ้ำใส่ branch เดิม ให้ยกเลิกรอบเก่าที่ยังค้างอยู่ ประหยัด runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # next typegen ต้องรันก่อน tsc เสมอ
      # Next 16 สร้าง type ของ route เช่น LayoutProps<"/"> ตอน dev หรือ build
      # ถ้าไม่ generate ก่อน tsc --noEmit จะเช็ค type ของ route ไม่ครบ
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm run build

  # job สรุปผล ใช้ตัวนี้ตัวเดียวเป็น required status check ใน branch protection
  # เวลาเพิ่ม job ใหม่ ไม่ต้องไปแก้ setting บน GitHub แค่เติมใน needs
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "มี job ที่ไม่ผ่าน"
            exit 1
          fi
          echo "ผ่านครบทุก job"
