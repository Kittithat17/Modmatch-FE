name: CI

# Runs on every push to every branch, so nobody's code lands unchecked.
# Runs again on PRs into main and dev, because pull_request builds the
# merge result while push only builds the branch head.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# Pushing again to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `next typegen` must run before tsc. Next 16 emits route types such as
      # LayoutProps<"/"> during dev, build or typegen only, so a bare
      # `tsc --noEmit` would not type-check route usage at all.
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm run build

  # Single summary job. Make this the only required status check in branch
  # protection: adding a job later means editing `needs` here rather than
  # changing repository settings.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one job did not pass"
            exit 1
          fi
          echo "All jobs passed"
